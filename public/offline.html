<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stephen Fleming Realty</title>
<!--
  Shown by the native app (capacitor.config.json server.errorPath) when
  flemingrealty.org cannot be reached. Without it the WebView sits on a blank
  navy screen with no message and no way back. Inline styles only: this file
  is served from the app bundle, so nothing else is guaranteed to load.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0D1B33; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 28px calc(32px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 12px; letter-spacing: .16em; color: #C8A15A; margin-bottom: 26px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 24px; line-height: 1.2; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.55; color: rgba(255,255,255,.78); margin: 0 0 28px; max-width: 320px; }
  button { appearance: none; border: 0; background: #C8A15A; color: #0D1B33; font: inherit; font-weight: 700; font-size: 15px; padding: 14px 28px; border-radius: 24px; min-width: 180px; }
  button:active { opacity: .85; }
  .phone { margin-top: 22px; font-size: 13px; color: rgba(255,255,255,.6); }
  .phone a { color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">STEPHEN FLEMING REALTY</div>
    <h1>Can't reach the office right now</h1>
    <p>Check your connection and try again. If it's urgent, such as a leak or no heat, call the office.</p>
    <button onclick="location.replace('https://www.flemingrealty.org/app')">Try again</button>
    <div class="phone">Office: <a href="tel:7177747791">717-774-7791</a></div>
  </div>
</body>
</html>
